services:
  - type: web
    name: poc-agent-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --timeout 120
    # --timeout 120: gunicorn's default worker timeout is 30s, which is
    # too short once LLM calls + automatic retries are factored in.
    envVars:
      - key: LLM_PROVIDER
        sync: false   # "anthropic" or "gemini" — set manually
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
