services:
  - type: web
    name: poc-agent-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 120
    # --timeout 120: gunicorn's default worker timeout is 30s, which is
    # too short once LLM calls + automatic retries are factored in.
    # --workers 1 --threads 8: live generation runs as an in-process background
    # job (webapp/jobs.py) whose state lives in this one process, and threads let
    # the browser's polling requests be served while a job is running.
    envVars:
      - key: LLM_PROVIDER
        sync: false   # "anthropic" or "gemini" — set manually
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: LLM_MAX_RPM
        value: "12"    # stay under Gemini free tier's 15 requests/min (raise on a paid tier)
      - key: LLM_MAX_PARALLEL
        value: "4"
